name: Release
run-name: ${{ github.actor }} releases a ${{ inputs.bump }} of ${{ github.repository }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # A Go module is released by its tag alone, so nothing gets tagged
      # that does not pass its tests.
      - name: Test before tagging
        run: go vet ./... && go test -race ./...
      # Renames "## NEXT RELEASE" of RELEASE_NOTES.md to the new version, tags
      # v<version>, publishes the GitHub Release from those notes and reopens
      # an empty "## NEXT RELEASE".
      - name: Release
        uses: softwarity/release-flow@v1
        with:
          bump: ${{ inputs.bump }}
          language: tag
