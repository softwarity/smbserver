name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the one job that writes (the compatibility matrix of
# the README) asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        env:
          # The race detector needs cgo and a C toolchain, which the Windows
          # runner does not guarantee; none of the concurrency is specific to
          # an operating system.
          RACE: ${{ matrix.os != 'windows-latest' && '-race' || '' }}
        run: go test $RACE ./...

  fuzz:
    name: Fuzz the decoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fuzz each target for a bounded time
        run: |
          for target in $(grep -oh '^func Fuzz[A-Za-z0-9]*' *_test.go | sed 's/func //'); do
            echo "::group::$target"
            go test -run '^$' -fuzz "^$target\$" -fuzztime 45s .
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashers
          path: testdata/fuzz

  linux:
    name: Linux clients (smbclient, cifs, docker volume)
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the clients
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q smbclient cifs-utils samba
          # The cifs module lives in the extra modules package on the
          # runner's cloud kernel.
          sudo modprobe cifs || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe cifs; }
      - name: Build
        run: go build -o bin/ ./cmd/smbserver ./test/tcpcut
      - name: Run the clients against a server under an unprivileged uid
        run: bash test/linux.sh bin results
      - name: Time everyday operations against Samba
        run: bash test/bench.sh bin results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-linux
          path: results/*

  macos:
    name: macOS client (mount_smbfs)
    needs: test
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o bin/ ./cmd/smbserver ./test/tcpcut
      - name: Mount and exercise the share
        run: bash test/macos.sh bin results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-macos
          path: results/*

  windows:
    name: Windows client (redirector)
    needs: test
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: go build -o bin/ ./cmd/smbserver ./test/tcpcut
      - name: Map and exercise the share
        shell: bash
        run: bash test/windows.sh bin results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-windows
          path: results/*.txt

  matrix:
    name: Compatibility matrix
    needs: [linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Build the table
        run: |
          go run ./test/matrix results | tee -a "$GITHUB_STEP_SUMMARY"
          go run ./test/matrix results README.md
      # The README states what this run observed. Only on main, and without
      # triggering another run: the commit changes one table.
      - name: Commit the table when it changed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Update the compatibility matrix [skip ci]' README.md
          # Main may have moved while the tests ran; the table is then the
          # business of the run that follows.
          git push || echo "main moved on, leaving the table to the next run"

  # A release is an approval on a green run, not a workflow of its own. Every
  # run on main ends here, waiting on the `release` environment, which
  # requires a reviewer: nothing happens until somebody approves, and what is
  # then released is the commit this run tested. The bump rides in the comment
  # of the approval: empty is a patch, "minor" or "major" say so. Not approving
  # costs nothing; the next push to main cancels the waiting run. A commit
  # whose message says [skip release] offers none.
  release:
    name: Release (approve to publish)
    needs: [fuzz, linux, macos, windows, matrix]
    if: >-
      !cancelled()
      && needs.fuzz.result == 'success' && needs.linux.result == 'success'
      && needs.macos.result == 'success' && needs.windows.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read the approval
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          approval=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            --jq '[.[] | select(.state == "approved") | select(any(.environments[]; .name == "release"))] | last')
          # GitHub creates an unprotected environment the first time a job
          # names one, and an unprotected one would release every push.
          if [ -z "$approval" ] || [ "$approval" = "null" ]; then
            echo "::error::nobody approved this release: the 'release' environment must require a reviewer (Settings > Environments > release)"
            exit 1
          fi
          comment=$(jq -r '.comment // ""' <<<"$approval")
          bump=$(printf '%s' "$comment" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          case "$bump" in
            "") bump="patch" ;;
            patch|minor|major) ;;
            *) echo "::error::the approval comment must be empty (patch), minor or major, not '$comment'"; exit 1 ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "approved as a $bump release"
      # The version commit and the tag are pushed by the release App, whose
      # key is a secret of the environment: it reaches this approved job and
      # no other.
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: smbserver
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      # main must still be the commit this run tested, give or take what
      # carries no code: the table the matrix job just wrote into the README,
      # and release notes pushed with [skip ci].
      - name: main is still the tested commit
        env:
          TESTED: ${{ github.sha }}
        run: |
          set -e
          head=$(git rev-parse HEAD)
          if [ "$head" != "$TESTED" ]; then
            moved=$(git diff --name-only "$TESTED" "$head" | grep -vxE 'README\.md|RELEASE_NOTES\.md' || true)
            if [ -n "$moved" ]; then
              echo "::error::main is at ${head::7} but this run tested ${TESTED::7}, and the difference is more than documentation:"
              echo "$moved" | sed 's/^/         /'
              echo "         Run the pipeline on main again, then approve that one."
              exit 1
            fi
            echo "main moved from ${TESTED::7} to ${head::7} by documentation only; releasing ${head::7} with this run's green"
          fi
      - name: Who the App commits as
        id: who
        env:
          SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      # Renames "## NEXT RELEASE" of RELEASE_NOTES.md to the new version,
      # reopens an empty one, commits and tags, all locally. Pinned to a
      # commit like every action that is not GitHub's own.
      - name: Release notes, version commit and tag
        id: flow
        uses: softwarity/release-flow@58d6aa0216d97976a623edca2fe484eababf5b57
        with:
          bump: ${{ steps.bump.outputs.bump }}
          language: tag
          push: "false"
          create-release: "false"
          commit-user-name: ${{ steps.who.outputs.name }}
          commit-user-email: ${{ steps.who.outputs.email }}
      # [skip ci]: the commit changes one Markdown file, and a pipeline
      # started by it would end on another release offer for the same code.
      - name: Push the version commit and the tag, create the GitHub Release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.flow.outputs.version }}
          TAG: ${{ steps.flow.outputs.tag }}
          NOTES: ${{ steps.flow.outputs.notes }}
        run: |
          set -e
          git commit --amend --reset-author -m "$VERSION [skip ci]"
          git tag -f "$TAG"
          git push origin HEAD:main "refs/tags/$TAG"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "## Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
